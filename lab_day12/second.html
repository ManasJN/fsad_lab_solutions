<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <h2>Credit Card Form</h2>

    <form onsubmit="return validateForm()">

        Name:
        <input type="text" id="name"><br><br>

        Card Number:
        <input type="text" id="card"><br><br>

        Expiry Month:
        <input type="text" id="month"><br><br>

        Expiry Year:
        <input type="text" id="year"><br><br>

        <input type="submit" value="Submit">

    </form>

    <script>

        function validateForm() {

            let name = document.getElementById("name").value;
            let card = document.getElementById("card").value;
            let month = document.getElementById("month").value;
            let year = document.getElementById("year").value;

            if (name == "") {
                alert("Name cannot be empty");
                return false;
            }

            if (card.length != 16 || isNaN(card)) {
                alert("Card number must contain 16 digits");
                return false;
            }

            if (month < 1 || month > 12) {
                alert("Month must be between 1 and 12");
                return false;
            }

            if (year.length != 2 || isNaN(year)) {
                alert("Year must contain 2 digits");
                return false;
            }

            alert("Form Submitted Successfully");
            return true;
        }

    </script>

</body>
</html>
