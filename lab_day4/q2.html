<!DOCTYPE html>
<html>
<head>
<title>User Registration Form</title>
</head>

<body>

<h2>User Registration Form</h2>

<form>

<label for="name">Name *</label><br>
<input type="text" id="name" name="name" maxlength="30" required><br><br>

<label for="email">E-mail *</label><br>
<input type="email" id="email" name="email" required><br><br>

<label for="dept">Department *</label><br>
<input list="departments" id="dept" name="dept" required
       pattern="CE|CS|EE|IE|ME"
       title="Enter one of: CE, CS, EE, IE, ME">
       
<datalist id="departments">
<option value="CE">
<option value="CS">
<option value="EE">
<option value="IE">
<option value="ME">
</datalist>
<br><br>

<label for="sem">Semester</label><br>
<input type="number" id="sem" name="sem" min="1" max="8" value="4">
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Clear">

</form>

</body>
</html>
