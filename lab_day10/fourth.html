<!DOCTYPE html>
<html>
<body>

<script>
    let n1 = 0, n2 = 1, next;
    let output = "Fibonacci Series:\n";

    for (let i = 1; i <= 20; i++) {
        output += n1 + " ";
        next = n1 + n2;
        n1 = n2;
        n2 = next;
    }

    alert(output);
</script>

</body>
</html>
