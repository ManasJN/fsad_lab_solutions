<!DOCTYPE html>
<html>
<body>

<script>
    let num = parseInt(prompt("Enter a positive integer:"));
    let isPrime = true;

    if (num <= 1) {
        isPrime = false;
    } else {
        for (let i = 2; i <= Math.sqrt(num); i++) {
            if (num % i === 0) {
                isPrime = false;
                break;
            }
        }
    }

    if (isPrime) {
        alert(num + " is Prime");
    } else {
        alert(num + " is Not Prime");
    }
</script>

</body>
</html>
