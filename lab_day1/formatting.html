<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags</title>
</head>
<body>

<h2>HTML Formatting Tags</h2>

<p>This is <small>small text</small>.</p>

<p>This is <mark>highlighted text</mark>.</p>

<p>He said <q>Hello World</q></p>

<blockquote>
    This is a blockquote example. It is used for long quotations.
</blockquote>

<p>The <abbr title="World Health Organization">WHO</abbr> was founded in 1948.</p>

<p>Example of code: <code>printf("Hello");</code></p>

<p>Sample output: <samp>Hello World</samp></p>

<p>Press <kbd>Ctrl</kbd> + <kbd>C</kbd> to copy.</p>

<p>Formula: <var>a</var> = <var>b</var> + <var>c</var></p>

</body>
</html>
