<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h2>Table Example</h2>

<table border="1">
    <caption>Student Marks</caption>

    <tr>
        <th>Name</th>
        <th colspan="2">Marks</th>
    </tr>

    <tr>
        <td rowspan="2">Manas</td>
        <td>Math</td>
        <td>90</td>
    </tr>

    <tr>
        <td>Science</td>
        <td>85</td>
    </tr>

</table>

</body>
</html>
