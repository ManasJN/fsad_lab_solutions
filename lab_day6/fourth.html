<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 100px;
    height: 100px;
    background-color: green;
    position: relative;
    animation: move 3s infinite;
}

@keyframes move {
    0%   {left: 0px;}
    50%  {left: 200px;}
    100% {left: 0px;}
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
