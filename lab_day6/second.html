<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 100px;
    height: 100px;
    background-color: orange;
    margin: 50px;
    transition: 1s;
}

.box:hover {
    transform: translate(50px, 20px) rotate(45deg) scale(1.5) skew(20deg);
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
