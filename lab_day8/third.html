<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;

            display: grid;
            grid-template-areas:
                "header header"
                "menu main"
                "footer footer";

            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr 60px;
        }

        .header {
            grid-area: header;
            background: #1fbc1a;
            color: white;
            text-align: center;
            line-height: 80px;
            font-size: 22px;
        }

        .menu {
            grid-area: menu;
            background: #3281d0;
            color: white;
            padding: 20px;
            height: 100%;
        }

        .main {
            grid-area: main;
            background: #dbe433;
            padding: 20px;
            height: 100%;
        }

        .footer {
            grid-area: footer;
            background: #cd32a1;
            color: white;
            text-align: center;
            line-height: 60px;
            font-size: 18px;
        }


        @media (max-width: 600px) {
            .container {
                grid-template-areas:
                    "header"
                    "menu"
                    "main"
                    "footer";

                grid-template-columns: 1fr;
                grid-template-rows: 60px auto auto 50px;
            }

            .header {
                line-height: 60px;
            }

            .footer {
                line-height: 50px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header">Header</div>
    <div class="menu">Menu</div>
    <div class="main">Main Content</div>
    <div class="footer">Footer</div>
</div>

</body>
</html>
