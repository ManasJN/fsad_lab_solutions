<!DOCTYPE html>
<html>
<head>
    <title>Responsive Font</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            transition: 0.3s;
        }

        h1 {
            font-size: 60px;
            color: rgb(67, 67, 224);
        }


        @media (max-width: 800px) {
            h1 {
                font-size: 30px;
                color: rgb(49, 213, 49);
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
        }


        @media (max-width: 300px) {
            h1 {
                font-size: 10px;
                color: rgb(255, 20, 67);
                font-family: 'Times New Roman', Times, serif;
            }
        }
    </style>
</head>
<body>

<h1>Hello, How are you</h1>

</body>
</html>
