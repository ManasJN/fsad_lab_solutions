<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image</title>
    <style>
        body {
            text-align: center;
        }

        img {
            width: 400px;
            border-radius: 10px;
            border: 2px solid rgb(29, 215, 60);
        }


        @media (max-width: 800px) {
            img {
                width: 250px;
                filter: grayscale(50%);
            }
        }


        @media (max-width: 300px) {
            img {
                width: 150px;
                filter: blur(1px);
            }
        }
    </style>
</head>
<body>

<h2>This is a beautiful image</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Phoenicopterus_ruber_in_S%C3%A3o_Paulo_Zoo.jpg" alt="Demo Image">

</body>
</html>
