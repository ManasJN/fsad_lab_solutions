<!DOCTYPE html>
<html>
<head>
    <title>Font Properties Demo</title>
    <style>
        .family { font-family: Arial, sans-serif; }
        .style { font-style: italic; }
        .weight { font-weight: bold; }
        .variant { font-variant: small-caps; }
        .size { font-size: 24px; }

        p {
            margin: 10px;
        }
    </style>
</head>
<body>

<h2>CSS Font Properties</h2>

<p class="family">This is Font Family (Arial)</p>
<p class="style">This is Italic Style</p>
<p class="weight">This is Bold Weight</p>
<p class="variant">This is Small Caps Variant</p>
<p class="size">This is Font Size 24px</p>

</body>
</html>
