<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors Demo</title>
    <style>
        .name { background-color: red; color: white; }
        .rgb { background-color: rgb(0, 128, 0); color: white; }
        .rgba { background-color: rgba(0, 0, 255, 0.5); color: white; }
        .hex { background-color: #ff9800; color: white; }
        .hsl { background-color: hsl(200, 100%, 50%); color: white; }
        .hsla { background-color: hsla(300, 100%, 50%, 0.5); color: white; }

        div {
            padding: 20px;
            margin: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h2>CSS Color Formats</h2>

<div class="name">Predefined Color Name</div>
<div class="rgb">RGB Color</div>
<div class="rgba">RGBA Color</div>
<div class="hex">Hex Color</div>
<div class="hsl">HSL Color</div>
<div class="hsla">HSLA Color</div>

</body>
</html>
