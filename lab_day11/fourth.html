<!DOCTYPE html>
<html>
<body>

<h3>Array Methods</h3>
<p id="output"></p>

<script>
let arr = [1, 2, 3];

arr.push(4);
arr.pop();
arr.unshift(0);
arr.shift();

let joined = arr.join("-");
let index = arr.indexOf(2);

let arr2 = [5, 6];
let merged = arr.concat(arr2);

let sliced = merged.slice(1, 4);

merged.splice(2, 1, 99);

document.getElementById("output").innerHTML =
"Join: " + joined + "<br>" +
"IndexOf 2: " + index + "<br>" +
"Concat: " + merged + "<br>" +
"Slice: " + sliced;
</script>

</body>
</html>
