<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>Date Methods</h3>
    <p id="date"></p>

    <script>
      let d = new Date();

      let output =
        "Time: " +
        d.getTime() +
        "<br>" +
        "Month: " +
        (d.getMonth() + 1) +
        "<br>" +
        "Date: " +
        d.getDate();

      document.getElementById("date").innerHTML = output;
    </script>
  </body>
</html>
